[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vccteamforge-api"
version = "0.1.0"
description = "API do VCCTeamForge (FastAPI + MongoDB 4.4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.153,<0.154",
    "uvicorn>=0.54,<0.55",
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.15,<3",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
