# VCCTeamForge — Nginx com HTTPS (recomendado; README §8).
# Instalar em /etc/nginx/sites-available/vccteamforge em vez de vccteamforge.conf.
# O certificado deve ser confiável nos postos (CA interna). Substituir nome e caminhos.

upstream vccteamforge_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=vccteamforge_api:10m rate=20r/s;

log_format vccteamforge '$remote_addr - $remote_user [$time_local] "$request" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rid=$request_id rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name vccteamforge.lan;
    server_tokens off;

    ssl_certificate /etc/ssl/vccteamforge/fullchain.pem;
    ssl_certificate_key /etc/ssl/vccteamforge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vccteamforge_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS só depois de confirmar que o HTTPS funciona em todos os postos.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/vccteamforge.access.log vccteamforge;
    error_log /var/log/nginx/vccteamforge.error.log warn;

    include snippets/vccteamforge-locations.conf;
}
