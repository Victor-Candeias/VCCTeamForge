# Locations comuns às variantes HTTP e HTTPS do VCCTeamForge.
# Instalar em /etc/nginx/snippets/vccteamforge-locations.conf.

root /var/www/VCCTeamForge;
index index.html;

# Anexos (fase 2); manter alinhado com o limite validado pela API.
client_max_body_size 25m;
client_body_timeout 30s;

include snippets/vccteamforge-security-headers.conf;

location /api/ {
    limit_req zone=vccteamforge_api burst=40 nodelay;

    proxy_pass http://vccteamforge_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Substitui (não acrescenta) para o cliente não conseguir forjar o IP usado no rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering on;
}

# A documentação OpenAPI só deve ser acessível internamente (README §6).
location ~ ^/api/(docs|openapi\.json)$ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://vccteamforge_api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
}

# Ficheiros gerados pelo Vite têm hash no nome: cache longa.
location /assets/ {
    include snippets/vccteamforge-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    include snippets/vccteamforge-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# SPA: rotas do React Router caem no index.html.
location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
